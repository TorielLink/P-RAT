        <line x1="172" y1="146" x2="172" y2="174"/><line x1="194" y1="146" x2="194" y2="174"/>
      </g>
      <g stroke="#c9d1d9" stroke-width="6" stroke-linecap="round">
        <line x1="48" y1="152" x2="208" y2="152"/><line x1="48" y1="168" x2="208" y2="168"/>
      </g></g>
  <g transform="rotate(-30 128 160)">
      <g stroke="#8b949e" stroke-width="5" stroke-linecap="round">
        <line x1="62" y1="146" x2="62" y2="174"/><line x1="84" y1="146" x2="84" y2="174"/>
        <line x1="172" y1="146" x2="172" y2="174"/><line x1="194" y1="146" x2="194" y2="174"/>
